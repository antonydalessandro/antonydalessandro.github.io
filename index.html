<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Antony D'Alessandro - Composer</title>
<style>
* {
margin: 0;
padding: 0;
box-sizing: border-box;
}

body {
background-color: #1a1a1a;
color: #ffffff;
font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
display: flex;
justify-content: center;
align-items: center;
min-height: 100vh;
padding: 40px 20px;
}

.container {
max-width: 680px;
width: 100%;
text-align: center;
}

.header {
margin-bottom: 25px;
}

.main-logo {
width: 200px;
height: auto;
margin-bottom: 15px;
filter: drop-shadow(0px 4px 10px rgba(0, 0, 0, 0.5));
}

.brand-title {
font-size: 1.1rem;
font-weight: 600;
letter-spacing: 2.5px;
color: #d4af37;
}

.profile-section {
margin-bottom: 35px;
}

.profile-img {
width: 140px;
height: 140px;
border-radius: 50%;
object-fit: cover;
border: 2px solid #d4af37;
margin-bottom: 15px;
}

.artist-name {
font-size: 1.4rem;
letter-spacing: 2px;
margin-bottom: 5px;
}

.artist-role {
font-size: 0.95rem;
letter-spacing: 3px;
color: #b0b0b0;
}

.platforms-section {
margin-bottom: 45px;
}

.grid-container {
display: grid;
grid-template-columns: repeat(4, 1fr);
gap: 20px;
justify-items: center;
align-items: center;
}

.platform-link {
transition: transform 0.2s ease, opacity 0.2s ease;
}

.platform-link:hover {
transform: scale(1.1);
opacity: 0.9;
}

.platform-icon {
width: 65px;
height: 65px;
object-fit: contain;
border-radius: 50%;
}

@media (max-width: 480px) {
.grid-container {
gap: 15px;
}
.platform-icon {
width: 55px;
height: 55px;
}
.main-logo {
width: 160px;
}
}

.bio-section {
text-align: left;
line-height: 1.6;
color: #cccccc;
margin-bottom: 40px;
padding: 0 10px;
}

.bio-section h3 {
color: #ffffff;
margin-bottom: 15px;
text-align: center;
letter-spacing: 1.5px;
}

.footer {
font-size: 0.8rem;
color: #777777;
border-top: 1px solid #333333;
padding-top: 20px;
}
</style>
</head>
<body>

<main class="container">

<!-- Header Logo -->
<header class="header">
<img src="logo.png" alt="Logo" class="main-logo">
<h1 class="brand-title">ANTONYDALESSANDRO.MUSIC</h1>
</header>

<!-- Profile Section -->
<section class="profile-section">
<img src="foto.jpg" alt="Antony D'Alessandro" class="profile-img">
<h2 class="artist-name">ANTONY D’ALESSANDRO</h2>
<p class="artist-role">COMPOSER</p>
</section>

<!-- Streaming Icons Grid (3x4) -->
<section class="platforms-section">
<div class="grid-container">

<!-- Linea 1 -->
<a href="https://bandcamp.com" target="_blank" rel="noopener" class="platform-link">
<img src="icon-bandcamp.png" alt="Bandcamp" class="platform-icon">
</a>
<a href="https://amazingradio.com" target="_blank" rel="noopener" class="platform-link">
<img src="icon-amazing-radio.png" alt="Amazing Radio" class="platform-icon">
</a>
<a href="https://myspace.com" target="_blank" rel="noopener" class="platform-link">
<img src="icon-myspace.png" alt="MySpace" class="platform-icon">
</a>
<a href="https://tiktok.com" target="_blank" rel="noopener" class="platform-link">
<img src="icon-tiktok.png" alt="TikTok" class="platform-icon">
</a>

<!-- Linea 2 -->
<a href="https://spotify.com" target="_blank" rel="noopener" class="platform-link">
<img src="icon-spotify.png" alt="Spotify" class="platform-icon">
</a>
<a href="https://apple.com/music" target="_blank" rel="noopener" class="platform-link">
<img src="icon-apple-music.png" alt="Apple Music" class="platform-icon">
</a>
<a href="https://youtube.com" target="_blank" rel="noopener" class="platform-link">
<img src="icon-youtube.png" alt="YouTube" class="platform-icon">
</a>
<a href="https://soundcloud.com" target="_blank" rel="noopener" class="platform-link">
<img src="icon-soundcloud.png" alt="SoundCloud" class="platform-icon">
</a>

<!-- Linea 3 -->
<a href="https://music.youtube.com" target="_blank" rel="noopener" class="platform-link">
<img src="icon-youtube-music.png" alt="YouTube Music" class="platform-icon">
</a>
<a href="https://music.amazon.com" target="_blank" rel="noopener" class="platform-link">
<img src="icon-amazon-music.png" alt="Amazon Music" class="platform-icon">
</a>
<a href="https://x.com" target="_blank" rel="noopener" class="platform-link">
<img src="icon-x.png" alt="X" class="platform-icon">
</a>
<a href="https://deezer.com" target="_blank" rel="noopener" class="platform-link">
<img src="icon-deezer.png" alt="Deezer" class="platform-icon">
</a>

</div>
</section>

<!-- Biography Section -->
<section class="bio-section">
<h3>Biografia</h3>
<p>
Inserisci qui il testo della tua biografia personale e professionale...
</p>
</section>

<!-- Footer -->
<footer class="footer">
<p>&copy; 2026 Antony D'Alessandro. All Rights Reserved.</p>
</footer>

</main>

</body>
</html>
