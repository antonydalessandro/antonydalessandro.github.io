<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Antony D'Alessandro - Official Site</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root {
--gold-primary: #d4af37;
--gold-light: #f3e5ab;
--gold-dark: #aa820a;
--silver-primary: #c0c0c0;
--silver-light: #e8e8e8;
--silver-dark: #707070;
--bg-dark: #121213;
--card-bg: #1e1e20;
}

* {
box-sizing: border-box;
margin: 0;
padding: 0;
}

body {
background-color: var(--bg-dark);
font-family: 'Montserrat', sans-serif;
color: #ffffff;
display: flex;
flex-direction: column;
align-items: center;
min-height: 100vh;
padding: 20px 15px;
}

.main-container {
width: 100%;
max-width: 500px;
text-align: center;
}

/* --- PLAYER RADIO ORO & SILVER --- */
.radio-container {
width: 100%;
background: linear-gradient(145deg, #2f2f32, #222224);
border: 2px solid var(--gold-primary);
border-radius: 16px;
padding: 18px;
box-shadow:
0 12px 35px rgba(0, 0, 0, 0.6),
inset 0 1px 1px rgba(255, 255, 255, 0.1),
0 0 15px rgba(212, 175, 55, 0.2);
margin-bottom: 25px;
}

.radio-header {
display: flex;
justify-content: space-between;
align-items: center;
margin-bottom: 14px;
padding-bottom: 8px;
border-bottom: 1px solid rgba(212, 175, 55, 0.3);
}

.radio-icon-svg {
width: 36px;
height: 36px;
fill: var(--gold-primary);
filter: drop-shadow(0px 2px 4px rgba(0,0,0,0.5));
}

.radio-grille {
display: flex;
gap: 3px;
}

.grille-bar {
width: 3px;
height: 14px;
background: linear-gradient(to bottom, var(--silver-light), var(--silver-dark));
border-radius: 2px;
}

.radio-screen {
background: #121213;
border: 1px solid var(--gold-dark);
border-radius: 8px;
padding: 12px 14px;
margin-bottom: 14px;
box-shadow: inset 0 2px 8px rgba(0,0,0,0.8);
text-align: left;
}

.track-number {
font-size: 0.7rem;
color: var(--silver-primary);
text-transform: uppercase;
letter-spacing: 1px;
margin-bottom: 3px;
}

.track-title {
font-size: 1rem;
font-weight: 600;
color: var(--gold-light);
white-space: nowrap;
overflow: hidden;
text-overflow: ellipsis;
margin-bottom: 10px;
}

.progress-area {
display: flex;
align-items: center;
gap: 8px;
}

.time-text {
font-size: 0.7rem;
color: var(--silver-primary);
min-width: 32px;
font-variant-numeric: tabular-nums;
}

.progress-bar-container {
flex: 1;
height: 5px;
background: #2a2a2d;
border-radius: 3px;
cursor: pointer;
position: relative;
}

.progress-bar {
height: 100%;
width: 0%;
background: linear-gradient(90deg, var(--gold-dark), var(--gold-primary), var(--silver-light));
border-radius: 3px;
}

.radio-controls {
display: flex;
justify-content: space-around;
align-items: center;
margin-bottom: 14px;
}

.control-btn {
background: linear-gradient(135deg, #3a3a3d, #252527);
border: 1px solid var(--silver-dark);
color: var(--silver-light);
border-radius: 50%;
width: 42px;
height: 42px;
display: flex;
justify-content: center;
align-items: center;
cursor: pointer;
transition: all 0.2s ease;
}

.control-btn.play-btn {
width: 52px;
height: 52px;
background: linear-gradient(135deg, var(--gold-primary), var(--gold-dark));
border: 2px solid var(--silver-light);
color: #121213;
box-shadow: 0 4px 12px rgba(212, 175, 55, 0.4);
}

.control-btn svg {
width: 18px;
height: 18px;
fill: currentColor;
}

.control-btn.play-btn svg {
width: 22px;
height: 22px;
}

.playlist-container {
background: #18181a;
border: 1px solid rgba(192, 192, 192, 0.15);
border-radius: 8px;
max-height: 150px;
overflow-y: auto;
padding: 4px;
text-align: left;
}

.playlist-item {
display: flex;
align-items: center;
padding: 8px 10px;
border-radius: 5px;
font-size: 0.82rem;
color: var(--silver-primary);
cursor: pointer;
margin-bottom: 2px;
}

.playlist-item.active {
background: linear-gradient(90deg, rgba(212, 175, 55, 0.2), transparent);
color: var(--gold-light);
font-weight: 600;
border-left: 3px solid var(--gold-primary);
}

.item-index {
width: 24px;
font-size: 0.75rem;
opacity: 0.7;
}

.item-title {
flex: 1;
white-space: nowrap;
overflow: hidden;
text-overflow: ellipsis;
}

/* --- INTESTAZIONE SITO --- */
.site-title {
font-family: 'Cinzel', serif;
font-size: 1.4rem;
letter-spacing: 3px;
color: var(--gold-primary);
margin-bottom: 20px;
text-transform: uppercase;
}

/* --- FOTO PROFILO --- */
.profile-pic {
width: 180px;
height: 180px;
border-radius: 50%;
object-fit: cover;
border: 3px solid var(--gold-primary);
box-shadow: 0 0 20px rgba(212, 175, 55, 0.3);
margin-bottom: 20px;
}

/* --- BIOGRAFIA & CITAZIONE --- */
.bio {
font-size: 0.95rem;
line-height: 1.6;
color: #e0e0e0;
margin-bottom: 20px;
font-weight: 300;
}

.quote {
font-family: 'Cinzel', serif;
font-size: 0.9rem;
font-style: italic;
color: var(--gold-light);
margin-bottom: 30px;
padding: 0 10px;
}

/* --- GRIGLIA ICONE STREAMING --- */
.links-grid {
display: grid;
grid-template-columns: repeat(4, 1fr);
gap: 15px;
margin-top: 10px;
}

.link-card {
background: var(--card-bg);
border: 1px solid rgba(212, 175, 55, 0.3);
border-radius: 12px;
padding: 12px 5px;
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
text-decoration: none;
color: #ffffff;
transition: transform 0.2s ease, border-color 0.2s ease;
}

.link-card:hover {
transform: translateY(-4px);
border-color: var(--gold-primary);
}

.link-card img {
width: 32px;
height: 32px;
margin-bottom: 6px;
}

.link-card span {
font-size: 0.7rem;
font-weight: 500;
}
</style>
</head>
<body>

<div class="main-container">

<!-- 1. PLAYER RADIO ORO & SILVER (IN ALTO) -->
<div class="radio-container">
<div class="radio-header">
<!-- Disegno Icona Radio in Oro -->
<svg class="radio-icon-svg" viewBox="0 0 24 24">
<path d="M3.24 6.15C2.51 6.43 2 7.15 2 8v11c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2H8.3l7.43-3.71c.41-.21.57-.71.36-1.12-.21-.41-.71-.57-1.12-.36L3.24 6.15zM7 17c-1.66 0-3-1.34-3-3s1.34-3 3-3 3 1.34 3 3-1.34 3-3 3zm13 1h-8v-2h8v2zm0-4h-8v-2h8v2z"/>
</svg>
<div class="radio-grille">
<div class="grille-bar"></div>
<div class="grille-bar"></div>
<div class="grille-bar"></div>
<div class="grille-bar"></div>
<div class="grille-bar"></div>
</div>
</div>

<div class="radio-screen">
<div class="track-number" id="track-number">Traccia 01 / 12</div>
<div class="track-title" id="track-title">The Land of Silence</div>

<div class="progress-area">
<span class="time-text" id="current-time">0:00</span>
<div class="progress-bar-container" id="progress-container">
<div class="progress-bar" id="progress-bar"></div>
</div>
