<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Antony D'Alessandro - Composer</title>
<style>
* {
margin: 0;
padding: 0;
box-sizing: border-box;
}

/* Sfondo identico a quello del Logo (#363638) e spazio superiore azzerato */
body {
background-color: #363638;
color: #ffffff;
font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
display: flex;
justify-content: center;
align-items: center;
min-height: 100vh;
padding: 20px 20px 40px 20px;
-webkit-hyphens: none;
-ms-hyphens: none;
hyphens: none;
}

.container {
max-width: 720px;
width: 100%;
text-align: center;
}

/* --- PLAYER RADIO ORO & SILVER --- */
.radio-container {
width: 100%;
max-width: 500px;
margin: 0 auto 35px auto;
background: linear-gradient(145deg, #2f2f32, #222224);
border: 2px solid #d4af37;
border-radius: 16px;
padding: 18px;
box-shadow:
0 12px 35px rgba(0, 0, 0, 0.6),
inset 0 1px 1px rgba(255, 255, 255, 0.1),
0 0 15px rgba(212, 175, 55, 0.2);
text-align: left;
}

.radio-header {
display: flex;
justify-content: space-between;
align-items: center;
margin-bottom: 14px;
padding-bottom: 10px;
border-bottom: 1px solid rgba(212, 175, 55, 0.3);
}

.radio-header-left {
display: flex;
align-items: center;
gap: 12px;
}

.radio-icon-svg {
width: 44px;
height: 44px;
fill: #d4af37;
filter: drop-shadow(0px 2px 4px rgba(0,0,0,0.5));
flex-shrink: 0;
}

.radio-brand-title {
font-size: 0.95rem;
font-weight: 600;
letter-spacing: 2px;
color: #d4af37;
text-transform: uppercase;
line-height: 1.2;
}

.radio-grille {
display: flex;
gap: 3px;
}

.grille-bar {
width: 3px;
height: 16px;
background: linear-gradient(to bottom, #e8e8e8, #707070);
border-radius: 2px;
}

.radio-screen {
background: #121213;
border: 1px solid #aa820a;
border-radius: 8px;
padding: 12px 14px;
margin-bottom: 14px;
box-shadow: inset 0 2px 8px rgba(0,0,0,0.8);
}

.track-number {
font-size: 0.7rem;
color: #c0c0c0;
text-transform: uppercase;
letter-spacing: 1px;
margin-bottom: 3px;
}

.track-title {
font-size: 1rem;
font-weight: 600;
color: #f3e5ab;
white-space: nowrap;
overflow: hidden;
text-overflow: ellipsis;
margin-bottom: 10px;
}

.progress-area {
display: flex;
align-items: center;
gap: 8px;
}

.time-text {
font-size: 0.7rem;
color: #c0c0c0;
min-width: 32px;
font-variant-numeric: tabular-nums;
}

.progress-bar-container {
flex: 1;
height: 6px;
background: #2a2a2d;
border-radius: 3px;
cursor: pointer;
position: relative;
}

.progress-bar {
height: 100%;
width: 0%;
background: linear-gradient(90deg, #aa820a, #d4af37, #e8e8e8);
border-radius: 3px;
}

.radio-controls {
display: flex;
justify-content: space-around;
align-items: center;
margin-bottom: 14px;
}

.control-btn {
background: linear-gradient(135deg, #3a3a3d, #252527);
border: 1px solid #707070;
color: #e8e8e8;
border-radius: 50%;
width: 44px;
height: 44px;
display: flex;
justify-content: center;
align-items: center;
cursor: pointer;
transition: all 0.2s ease;
-webkit-tap-highlight-color: transparent;
}

.control-btn.play-btn {
width: 54px;
height: 54px;
background: linear-gradient(135deg, #d4af37, #aa820a);
border: 2px solid #e8e8e8;
color: #121213;
box-shadow: 0 4px 12px rgba(212, 175, 55, 0.4);
}

.control-btn svg {
width: 20px;
height: 20px;
fill: currentColor;
}

.control-btn.play-btn svg {
width: 24px;
height: 24px;
}

.playlist-container {
background: #18181a;
border: 1px solid rgba(192, 192, 192, 0.15);
border-radius: 8px;
max-height: 150px;
overflow-y: auto;
padding: 4px;
}

.playlist-item {
display: flex;
align-items: center;
padding: 8px 10px;
border-radius: 5px;
font-size: 0.82rem;
color: #c0c0c0;
cursor: pointer;
margin-bottom: 2px;
}

.playlist-item.active {
background: linear-gradient(90deg, rgba(212, 175, 55, 0.2), transparent);
color: #f3e5ab;
font-weight: 600;
border-left: 3px solid #d4af37;
}

.item-index {
width: 24px;
font-size: 0.75rem;
opacity: 0.7;
}

.item-title {
flex: 1;
white-space: nowrap;
overflow: hidden;
text-overflow: ellipsis;
}

.header {
margin-top: 0;
margin-bottom: 10px;
}

/* Profile Section - Foto allineata perfettamente alla larghezza del player */
.profile-section {
margin-bottom: 40px;
}

.profile-img {
width: 100%;
max-width: 500px;
height: auto;
aspect-ratio: 1 / 1;
object-fit: cover;
border-radius: 16px;
border: 3px solid #d4af37;
margin: 0 auto 20px auto;
display: block;
box-shadow: 0 8px 25px rgba(0,0,0,0.5);
}

.artist-name {
font-size: 1.35rem;
letter-spacing: 2px;
margin-bottom: 6px;
}

.artist-role {
font-size: 1rem;
letter-spacing: 3px;
color: #b0b0b0;
}

/* Platforms Grid (3x4) */
.platforms-section {
margin-bottom: 50px;
}

.grid-container {
display: grid;
grid-template-columns: repeat(4, 1fr);
gap: 25px;
justify-items: center;
align-items: center;
}

.platform-link {
transition: transform 0.2s ease, opacity 0.2s ease;
display: inline-block;
}

.platform-link:hover {
transform: scale(1.12);
opacity: 0.9;
}

.platform-icon {
width: 70px;
height: 70px;
object-fit: contain;
border-radius: 50%;
display: block;
}

@media (max-width: 480px) {
.grid-container {
gap: 15px;
}
.platform-icon {
width: 55px;
height: 55px;
}
.radio-brand-title {
font-size: 0.8rem;
letter-spacing: 1.5px;
}
}

/* Quote & Bio Section */
.quote-box {
margin-bottom: 35px;
padding: 20px 25px;
border-left: 3px solid #d4af37;
border-right: 3px solid #d4af37;
background-color: #2b2b2d;
border-radius: 8px;
}

.quote-text {
font-style: italic;
font-size: 1.05rem;
line-height: 1.6;
color: #e0e0e0;
margin-bottom: 10px;
}

.quote-author {
font-size: 0.9rem;
letter-spacing: 2px;
color: #d4af37;
font-weight: 500;
}

.bio-section {
text-align: left;
line-height: 1.8;
color: #cccccc;
margin-bottom: 50px;
padding: 0 10px;
}

.bio-section p {
margin-bottom: 20px;
font-size: 0.98rem;
}

.no-wrap {
white-space: nowrap;
}

/* Footer */
.footer {
font-size: 0.85rem;
font-weight: 700;
color: #aaaaaa;
border-top: 1px solid #4a4a4d;
padding-top: 25px;
line-height: 1.7;
letter-spacing: 0.5px;
}

.footer p {
margin-bottom: 5px;
}

.symbol-c, .symbol-p {
display: inline-block;
font-weight: 700;
font-size: 0.95rem;
vertical-align: middle;
margin-right: 2px;
}
</style>
</head>
<body>

<main class="container">

<!-- Header con Radio Oro & Silver -->

<div class="radio-container">
<div class="radio-header">
