<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Antony D'Alessandro - Gold & Silver Radio Player</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
--gold-primary: #d4af37;
--gold-light: #f3e5ab;
--gold-dark: #aa820a;
--silver-primary: #c0c0c0;
--silver-light: #e8e8e8;
--silver-dark: #707070;
--bg-dark: #1e1e20;
--panel-bg: #2b2b2d;
}

* {
box-sizing: border-box;
margin: 0;
padding: 0;
}

body {
background-color: var(--bg-dark);
font-family: 'Montserrat', sans-serif;
color: #ffffff;
display: flex;
justify-content: center;
align-items: center;
min-height: 100vh;
padding: 20px;
}

/* Container della Radio Vintage & Futuro */
.radio-container {
width: 100%;
max-width: 520px;
background: linear-gradient(145deg, #2f2f32, #222224);
border: 2px solid var(--gold-primary);
border-radius: 16px;
padding: 24px;
box-shadow:
0 12px 35px rgba(0, 0, 0, 0.6),
inset 0 1px 1px rgba(255, 255, 255, 0.1),
0 0 15px rgba(212, 175, 55, 0.2);
position: relative;
}

/* Testata Radio con Dettagli Metallici */
.radio-header {
display: flex;
justify-content: space-between;
align-items: center;
margin-bottom: 20px;
padding-bottom: 12px;
border-bottom: 1px solid rgba(212, 175, 55, 0.3);
}

.radio-brand {
font-family: 'Cinzel', serif;
font-size: 1.1rem;
font-weight: 700;
letter-spacing: 2px;
background: linear-gradient(45deg, var(--gold-light), var(--gold-primary), var(--silver-light));
-webkit-background-clip: text;
-webkit-text-fill-color: transparent;
text-transform: uppercase;
}

.radio-grille {
display: flex;
gap: 3px;
}

.grille-bar {
width: 3px;
height: 14px;
background: linear-gradient(to bottom, var(--silver-light), var(--silver-dark));
border-radius: 2px;
}

/* Schermo / Display della Radio */
.radio-screen {
background: #121213;
border: 1px solid var(--gold-dark);
border-radius: 8px;
padding: 16px;
margin-bottom: 20px;
box-shadow: inset 0 2px 8px rgba(0,0,0,0.8);
position: relative;
overflow: hidden;
}

.track-number {
font-size: 0.75rem;
color: var(--silver-primary);
text-transform: uppercase;
letter-spacing: 1px;
margin-bottom: 4px;
}

.track-title {
font-size: 1.1rem;
font-weight: 600;
color: var(--gold-light);
white-space: nowrap;
overflow: hidden;
text-overflow: ellipsis;
margin-bottom: 12px;
}

/* Barra di Avanzamento */
.progress-area {
display: flex;
align-items: center;
gap: 10px;
}

.time-text {
font-size: 0.75rem;
color: var(--silver-primary);
min-width: 38px;
font-variant-numeric: tabular-nums;
}

.progress-bar-container {
flex: 1;
height: 6px;
background: #2a2a2d;
border-radius: 3px;
cursor: pointer;
position: relative;
}

.progress-bar {
height: 100%;
width: 0%;
background: linear-gradient(90deg, var(--gold-dark), var(--gold-primary), var(--silver-light));
border-radius: 3px;
position: relative;
}

.progress-bar::after {
content: '';
position: absolute;
right: -5px;
top: -3px;
width: 12px;
height: 12px;
background: var(--silver-light);
border: 1px solid var(--gold-dark);
border-radius: 50%;
box-shadow: 0 0 5px rgba(0,0,0,0.5);
}

/* Controlli della Radio */
.radio-controls {
display: flex;
justify-content: space-between;
align-items: center;
margin-bottom: 20px;
}

.control-btn {
background: linear-gradient(135deg, #3a3a3d, #252527);
border: 1px solid var(--silver-dark);
color: var(--silver-light);
border-radius: 50%;
width: 44px;
height: 44px;
display: flex;
justify-content: center;
align-items: center;
cursor: pointer;
transition: all 0.2s ease;
box-shadow: 0 4px 8px rgba(0,0,0,0.4);
}

.control-btn:hover {
border-color: var(--gold-primary);
color: var(--gold-light);
transform: translateY(-2px);
}

.control-btn.play-btn {
width: 58px;
height: 58px;
background: linear-gradient(135deg, var(--gold-primary), var(--gold-dark));
border: 2px solid var(--silver-light);
color: #121213;
box-shadow: 0 4px 12px rgba(212, 175, 55, 0.4);
}

.control-btn.play-btn:hover {
transform: scale(1.05);
background: linear-gradient(135deg, var(--gold-light), var(--gold-primary));
}

.control-btn svg {
width: 20px;
height: 20px;
fill: currentColor;
}

.control-btn.play-btn svg {
width: 26px;
height: 26px;
}

/* Lista Brani Elegante */
.playlist-container {
background: #18181a;
border: 1px solid rgba(192, 192, 192, 0.15);
border-radius: 8px;
max-height: 180px;
overflow-y: auto;
padding: 6px;
}

.playlist-container::-webkit-scrollbar {
width: 5px;
}

.playlist-container::-webkit-scrollbar-thumb {
background: var(--gold-dark);
border-radius: 3px;
}

.playlist-item {
display: flex;
align-items: center;
padding: 10px 12px;
border-radius: 6px;
font-size: 0.85rem;
color: var(--silver-primary);
cursor: pointer;
transition: background 0.2s ease;
margin-bottom: 2px;
}

.playlist-item:hover {
background: rgba(212, 175, 55, 0.1);
color: var(--gold-light);
}

.playlist-item.active {
background: linear-gradient(90deg, rgba(212, 175, 55, 0.2), transparent);
color: var(--gold-light);
font-weight: 600;
border-left: 3px solid var(--gold-primary);
}

.item-index {
width: 26px;
font-size: 0.75rem;
opacity: 0.7;
}

.item-title {
flex: 1;
white-space: nowrap;
overflow: hidden;
text-overflow: ellipsis;
}
</style>
</head>
<body>

<div class="radio-container">
<!-- Testata Metallica -->
<div class="radio-header">
<div class="radio-brand">Antony D'Alessandro Radio</div>
<div class="radio-grille">
<div class="grille-bar"></div>
<div class="grille-bar"></div>
<div class="grille-bar"></div>
<div class="grille-bar"></div>
<div class="grille-bar"></div>
</div>
</div>

<!-- Display / Schermo -->
<div class="radio-screen">
<div class="track-number" id="track-number">Traccia 01 / 12</div>
<div class="track-title" id="track-title">The Land of Silence</div>

<div class="progress-area">
<span class="time-text" id="current-time">0:00</span>
<div class="progress-bar-container" id="progress-container">
<div class="progress-bar" id="progress-bar"></div>
</div>
<span class="time-text" id="duration">0:00</span>
</div>
</div>

<!-- Controlli Riproduzione -->
<div class="radio-controls">
<button class="control-btn" id="prev-btn" title="Brano precedente">
<svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
</button>

<button class="control-btn play-btn" id="play-btn" title="Play/Pausa">
<svg id="play-icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
</button>

<button class="control-btn" id="next-btn" title="Brano successivo">
<svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
</button>
</div>

<!-- Lista dei 12 Brani -->
<div class="playlist-container" id="playlist">
<!-- Generata dinamicamente via JS -->
</div>
</div>

<!-- Audio Element Nascosto -->
<audio id="audio-player"></audio>

<script>
const tracks = [
"The Land of Silence",
"Hollow Bloom",
"All the Love I Can",
"All the Love I Can (Instrumental Version)",
"Beyond the River",
"CHIAROSCURO",
"Il punto della situazione",
"TikTok Swing",
"System Error",
"TK Remaster",
"Scrubbed",
"The Collective"
];

let currentTrackIndex = 0;
let isPlaying = false;

const audio = document.getElementById('audio-player');
const playBtn = document.getElementById('play-btn');
const playIcon = document.getElementById('play-icon');
const prevBtn = document.getElementById('prev-btn');
const nextBtn = document.getElementById('next-btn');
const trackTitle = document.getElementById('track-title');
const trackNumber = document.getElementById('track-number');
const currentTimeEl = document.getElementById('current-time');
const durationEl = document.getElementById('duration');
const progressBar = document.getElementById('progress-bar');
const progressContainer = document.getElementById('progress-container');
const playlistEl = document.getElementById('playlist');

// Inizializza la Playlist Visiva
function renderPlaylist() {
playlistEl.innerHTML = '';
tracks.forEach((title, index) => {
const item = document.createElement('div');
item.classList.add('playlist-item');
if (index === currentTrackIndex) item.classList.add('active');

item.innerHTML = `
<span class="item-index">${String(index + 1).padStart(2, '0')}</span>
<span class="item-title">${title}</span>
`;

item.addEventListener('click', () => {
loadTrack(index);
playAudio();
});

playlistEl.appendChild(item);
});
}

// Carica la Traccia (collegata al file numerico, es: 1.mp3)
function loadTrack(index) {
currentTrackIndex = index;
const fileNumber = index + 1;
audio.src = `${fileNumber}.mp3`;
trackTitle.textContent = tracks[index];
trackNumber.textContent = `Traccia ${String(fileNumber).padStart(2, '0')} / 12`;
renderPlaylist();
}

// Controlli Play / Pausa
function playAudio() {
isPlaying = true;
audio.play();
playIcon.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
}

function pauseAudio() {
isPlaying = false;
audio.pause();
playIcon.innerHTML = '<path d="M8 5v14l11-7z"/>';
}

playBtn.addEventListener('click', () => {
if (isPlaying) {
pauseAudio();
} else {
if (!audio.src) loadTrack(0);
playAudio();
}
});

prevBtn.addEventListener('click', () => {
currentTrackIndex = (currentTrackIndex - 1 + tracks.length) % tracks.length;
loadTrack(currentTrackIndex);
playAudio();
});

nextBtn.addEventListener('click', () => {
currentTrackIndex = (currentTrackIndex + 1) % tracks.length;
loadTrack(currentTrackIndex);
playAudio();
});

// Avanzamento e Tempo
audio.addEventListener('timeupdate', (e) => {
const { currentTime, duration } = e.target;
if (isNaN(duration)) return;

const progressPercent = (currentTime / duration) * 100;
progressBar.style.width = `${progressPercent}%`;

currentTimeEl.textContent = formatTime(currentTime);
durationEl.textContent = formatTime(duration);
});

// Cambio Traccia Automatico a Fine Brano
audio.addEventListener('ended', () => {
nextBtn.click();
});

// Seleziona il punto sulla barra
progressContainer.addEventListener('click', (e) => {
const width = progressContainer.clientWidth;
const clickX = e.offsetX;
const duration = audio.duration;
if (!isNaN(duration)) {
audio.currentTime = (clickX / width) * duration;
}
});

function formatTime(seconds) {
const mins = Math.floor(seconds / 60);
const secs = Math.floor(seconds % 60);
return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
}

// Carica la prima traccia all'avvio
loadTrack(0);
</script>
</body>
</html>
