<!DOCTYPE html>

<title>Antony D'Alessandro - Composer</title>
<style>
* {
margin: 0;
padding: 0;
box-sizing: border-box;
}

/* Sfondo identico a quello della grafica del Logo */
body {
background-color: #2b2b2e;
color: #ffffff;
font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
display: flex;
justify-content: center;
align-items: center;
min-height: 100vh;
padding: 40px 20px;
}

.container {
max-width: 720px;
width: 100%;
text-align: center;
}

/* Header & Logo */
.header {
margin-bottom: 30px;
}

.main-logo {
width: 280px;
height: auto;
margin-bottom: 15px;
border-radius: 12px;
}

.brand-title {
font-size: 1.2rem;
font-weight: 600;
letter-spacing: 3px;
color: #d4af37;
}

/* Profile Section */
.profile-section {
margin-bottom: 40px;
}

.profile-img {
width: 320px;
height: 320px;
border-radius: 50%;
object-fit: cover;
border: 3px solid #d4af37;
margin-bottom: 20px;
box-shadow: 0 8px 25px rgba(0,0,0,0.5);
}

.artist-name {
font-size: 1.6rem;
letter-spacing: 2px;
margin-bottom: 6px;
}

.artist-role {
font-size: 1rem;
letter-spacing: 3px;
color: #b0b0b0;
}

/* Platforms Grid (3x4) */
.platforms-section {
margin-bottom: 50px;
}

.grid-container {
display: grid;
grid-template-columns: repeat(4, 1fr);
gap: 25px;
justify-items: center;
align-items: center;
}

.platform-link {
transition: transform 0.2s ease, opacity 0.2s ease;
display: flex;
justify-content: center;
align-items: center;
width: 80px;
height: 80px;
border-radius: 50%;
background-color: #ffffff;
padding: 8px;
box-shadow: 0 4px 10px rgba(0,0,0,0.4);
overflow: hidden;
}

.platform-link:hover {
transform: scale(1.12);
opacity: 0.9;
}

.platform-icon {
width: 100%;
height: 100%;
object-fit: contain;
border-radius: 50%;
}

@media (max-width: 480px) {
.grid-container {
gap: 15px;
}
.platform-link {
width: 65px;
height: 65px;
padding: 6px;
}
.main-logo {
width: 220px;
}
.profile-img {
width: 240px;
height: 240px;
}
}

/* Quote & Bio Section */
.quote-box {
margin-bottom: 35px;
padding: 20px 25px;
border-left: 3px solid #d4af37;
border-right: 3px solid #d4af37;
background-color: #202022;
border-radius: 8px;
}

.quote-text {
font-style: italic;
font-size: 1.05rem;
line-height: 1.6;
color: #e0e0e0;
margin-bottom: 10px;
}

.quote-author {
font-size: 0.9rem;
letter-spacing: 2px;
color: #d4af37;
font-weight: 500;
}

.bio-section {
text-align: left;
line-height: 1.8;
color: #cccccc;
margin-bottom: 50px;
padding: 0 10px;
}

.bio-section p {
margin-bottom: 20px;
font-size: 0.98rem;
}

.no-wrap {
white-space: nowrap;
}

/* Footer */
.footer {
font-size: 0.85rem;
color: #888888;
border-top: 1px solid #444448;
padding-top: 25px;
line-height: 1.6;
}

.footer p {
margin-bottom: 5px;
}
</style>
</head>
